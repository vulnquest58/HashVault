<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-label="HashVault wordmark by vulnquest">
  <title>HashVault — vulnquest</title>
  <style>
    .bg      { fill: #0b1020; }

               font-size: 30px; letter-spacing: 0; }
    .bright  { fill: #4fd6ff; }
    .cyan    { fill: #29b6d8; }
    .white   { fill: #eef4f8; }
    .name    { fill: #4fd6ff; font-family: "Cascadia Mono", "Consolas", monospace;
               font-size: 20px; font-weight: 700; }
    .link    { fill: #8fa6b8; font-family: "Cascadia Mono", "Consolas", monospace;
               font-size: 13px; }
  </style>

  <rect class="bg" x="0" y="0" width="640" height="180" rx="14"/>
  <rect x="0.5" y="0.5" width="639" height="179" rx="14"
        fill="none" stroke="#1d2b45" stroke-width="1"/>


[project]
name = "hashvault"
version = "0.1.0"
description = "Security auditing tool for password strength assessment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "vulnquest", email = "vulnquest58@users.noreply.github.com"}
]

[project.urls]
Homepage = "https://github.com/vulnquest58/HashVault"
Repository = "https://github.com/vulnquest58/HashVault"
Author = "https://github.com/vulnquest58"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "prompt_toolkit>=3.0.43",
    "platformdirs>=4.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
builtin = [
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
hashvault = "hashvault.__main__:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hashvault*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

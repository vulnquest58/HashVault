[project]
name = "hashvault"
version = "2.0.0"
description = "Evidence-driven password hash analysis, recovery, and audit reporting for authorized security testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "vulnquest", email = "vulnquest58@users.noreply.github.com"}
]
keywords = [
    "password-security",
    "hash-identification",
    "password-auditing",
    "security-tools",
    "hashcat",
    "john-the-ripper",
    "ctf",
    "digital-forensics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "typer>=0.29.2",
    "rich>=15.0.0",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "prompt_toolkit>=3.0.53",
    "platformdirs>=4.14.8",
    "cryptography>=50.0.2",
]

[project.urls]
Homepage = "https://github.com/vulnquest58/HashVault"
Documentation = "https://github.com/vulnquest58/HashVault/tree/main/docs"
Repository = "https://github.com/vulnquest58/HashVault"
Changelog = "https://github.com/vulnquest58/HashVault/blob/main/CHANGELOG.md"
Issues = "https://github.com/vulnquest58/HashVault/issues"
Security = "https://github.com/vulnquest58/HashVault/security/policy"
Author = "https://github.com/vulnquest58"

[project.optional-dependencies]
builtin = [
    "passlib>=1.9.5",
    "bcrypt>=5.0.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "bcrypt>=5.0.0",
]

[project.scripts]
hashvault = "hashvault.__main__:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hashvault*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

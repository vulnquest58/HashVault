name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: uv build --sdist

      - name: Verify source distribution contents
        run: |
          set -euo pipefail
          archive="$(ls dist/*.tar.gz)"
          tar -tf "$archive" > /tmp/sdist-files.txt
          grep -q '/data/patterns/patterns.json' /tmp/sdist-files.txt
          grep -q '/docs/CORPUS.md' /tmp/sdist-files.txt
          grep -q '/examples/0xdf-demo.txt' /tmp/sdist-files.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

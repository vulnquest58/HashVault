name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra builtin

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Compile sources
        run: uv run python -m compileall -q hashvault tests

      - name: Lint campaign package
        run: uv run python -m ruff check hashvault/campaign tests/test_campaign.py

      - name: Verify 0xdf corpus
        run: uv run python -m pytest -q tests/test_corpus.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra builtin

      - name: Run tests with coverage gate
        run: uv run python -m pytest -q --cov=hashvault --cov-fail-under=70

      - name: Compile sources
        run: uv run python -m compileall -q hashvault tests

      - name: Lint campaign and evidence packages
        run: >-
          uv run python -m ruff check
          hashvault/campaign hashvault/core/evidence.py
          hashvault/core/evidence_schema.py hashvault/core/corpus_validator.py
          tests/test_campaign.py tests/test_evidence_schema.py
          tests/test_corpus_validator.py

      - name: Verify 0xdf corpus
        run: uv run python -m pytest -q tests/test_corpus.py

      - name: Validate bundled corpus
        run: uv run hashvault corpus validate --strict

  windows:
    name: Windows Python 3.12
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra builtin

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Compile sources
        run: uv run python -m compileall -q hashvault tests

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/hashvault-smoke
          uv pip install --python /tmp/hashvault-smoke/bin/python dist/*.whl
          mkdir -p /tmp/hashvault-smoke-run
          cd /tmp/hashvault-smoke-run
          /tmp/hashvault-smoke/bin/hashvault banner --json > /tmp/banner.json
          /tmp/hashvault-smoke/bin/python -c "import json; json.load(open('/tmp/banner.json'))"
          /tmp/hashvault-smoke/bin/hashvault setup
          /tmp/hashvault-smoke/bin/hashvault doctor --json > /tmp/doctor.json
          /tmp/hashvault-smoke/bin/python -c "import json; d=json.load(open('/tmp/doctor.json')); assert d['ok'], d; assert any(c['name'] == 'Layer corpus' and c['status'] == 'ok' for c in d['checks']), d"

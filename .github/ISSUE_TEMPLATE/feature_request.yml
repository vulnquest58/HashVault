name: Feature request
description: Propose a scoped improvement with a clear use case
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Large features should be discussed before implementation. Describe the
        problem and the authorization boundary; do not include sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it scoped and explain the expected behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analysis
        - Identification
        - Cracking
        - Campaign recovery
        - Evidence/certificates
        - Corpus
        - CLI/UX
        - Documentation
        - Packaging/CI
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and misuse considerations
      description: How does this stay within authorized testing and avoid new risk?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: I am not requesting unauthorized access or evasion features.
          required: true
